_schema-version: 3.3.0
ID: anubhav-afctl
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: anubhav-afctl-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: anubhav-afctl-db

  - name: anubhav-afctl-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: anubhav-afctl-db

  - name: anubhav-afctl-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: anubhavafctlanubhavui
          artifacts:
            - anubhav-ui.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: anubhav-afctl-app-front
        parameters:
          content-target: true
    parameters:
      config:
        destinations:
          - name: srv-api
            url: ~{srv-api/srv-url}
            forwardAuthToken: true
          - name: ui5
            url: https://ui5.sap.com

  - name: anubhavafctlanubhavui
    type: html5
    path: app/anubhav-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: anubhav-afctl-app-front
    type: org.cloudfoundry.managed-service
    parameters:
      service: app-front
      service-plan: developer

  - name: anubhav-afctl-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
