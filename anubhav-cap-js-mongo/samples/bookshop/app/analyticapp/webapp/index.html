<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshop Analytics</title>
  <!-- sap.viz is part of SAPUI5 (not OpenUI5) -> bootstrap from ui5.sap.com -->
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.viz"
    data-sap-ui-resource-roots='{ "anubhav.analyticapp": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true">
  </script>
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component data-name="anubhav.analyticapp" data-id="container" data-settings='{ "id": "analyticapp" }' data-height="100%"></div>
</body>
</html>
